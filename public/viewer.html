<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RelayHub · 远程窗口</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./viewer.css"><script type="module" src="./viewer.js"></script></head><body>
<header><a href="./" class="brand" title="返回工作台">◈ <strong>RelayHub</strong></a><div><span id="mode">正在连接</span><span id="metrics"></span></div><div class="viewer-tools"><select id="quality" aria-label="画质模式" disabled><option value="economy">省流 · 4 FPS</option><option value="balanced" selected>均衡 · 8 FPS</option><option value="smooth">流畅 · 15 FPS</option></select><button id="fullscreen" title="切换全屏">全屏</button><button id="reconnect">重新连接</button></div></header>
<nav id="tabs" aria-label="远程浏览器标签页"></nav>
<form id="navigation"><button type="button" data-nav="back" title="后退">←</button><button type="button" data-nav="forward" title="前进">→</button><button type="button" data-nav="reload" title="刷新网页">↻</button><input id="address" aria-label="远程地址" placeholder="正在启动远程窗口…" autocomplete="off"><button type="submit">前往</button></form>
<main id="stage"><canvas id="screen" width="1280" height="800" aria-label="远程浏览器画面"></canvas><div id="placeholder"><div class="spinner"></div><h1>正在连接远程浏览器</h1><p id="status">画面将在浏览器就绪后出现。</p><a id="return-to-workspace" href="./">返回工作台</a></div><textarea id="keyboard" aria-label="远程键盘输入与中文输入法" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></main>
<footer><span id="session-label">独立画面 · 定向输入</span><span id="viewer-backend">尚未读取服务地址</span><span>1280 × 800 · JPEG / WebSocket · 当前版本无音频</span></footer><div id="notice" role="alert" hidden></div>
</body></html>
