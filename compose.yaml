services:
  relayhub:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3410:3410"
    volumes:
      - relayhub-data:/app/data
    shm_size: 1gb
    mem_limit: 4g
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3410/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
volumes:
  relayhub-data:
